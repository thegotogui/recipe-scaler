<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Recipes — grams</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,500&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #14120d;
    --surface: #1b1812;
    --surface-2: #221e17;
    --text: #efe9db;
    --text-muted: #948d7c;
    --text-faint: #6b6558;
    --accent: #c79a4b;
    --accent-dim: #8a7040;
    --hairline: rgba(239,233,219,0.10);
    --hairline-strong: rgba(239,233,219,0.16);
  }

  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', system-ui, sans-serif;
    font-variant-numeric: lining-nums;
    min-height: 100dvh;
    padding-bottom: env(safe-area-inset-bottom, 0);
  }

  /* ---- Top bar / picker ---- */
  .topbar{
    position: sticky;
    top: 0;
    z-index: 10;
    background: linear-gradient(var(--bg) 82%, transparent);
    padding: max(14px, env(safe-area-inset-top)) 16px 10px;
  }
  .eyebrow{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.68rem;
    letter-spacing: 0.14em;
    color: var(--text-faint);
    margin: 0 0 8px 2px;
  }
  .picker{
    position: relative;
    background: var(--surface);
    border: 1px solid var(--hairline-strong);
    border-radius: 10px;
  }
  .picker::after{
    content: "";
    position: absolute;
    right: 16px;
    top: 50%;
    width: 8px;
    height: 8px;
    border-right: 1.5px solid var(--accent);
    border-bottom: 1.5px solid var(--accent);
    transform: translateY(-70%) rotate(45deg);
    pointer-events: none;
  }
  select#recipeSelect optgroup{
    background: var(--surface);
    color: var(--accent);
    font-family: 'IBM Plex Mono', monospace;
    font-style: normal;
    font-size: 0.75rem;
    letter-spacing: 0.06em;
  }
  select#recipeSelect{
    appearance: none;
    -webkit-appearance: none;
    width: 100%;
    background: transparent;
    border: none;
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 1rem;
    font-weight: 500;
    padding: 14px 40px 14px 14px;
    min-height: 48px;
  }
  select#recipeSelect:focus-visible{
    outline: 2px solid var(--accent);
    outline-offset: -2px;
    border-radius: 10px;
  }
  select#recipeSelect option{
    background: var(--surface);
    color: var(--text);
  }

  /* ---- Title block ---- */
  .titleblock{
    padding: 26px 18px 6px;
  }
  h1#recipeTitle{
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 1.9rem;
    line-height: 1.15;
    margin: 0;
    color: var(--text);
  }
  p#recipeMeta{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.78rem;
    letter-spacing: 0.02em;
    color: var(--accent-dim);
    margin: 8px 0 0;
    min-height: 1em;
  }

  /* ---- Empty state ---- */
  .empty{
    padding: 20vh 32px 0;
    text-align: center;
  }
  .empty p{
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-size: 1.15rem;
    color: var(--text-muted);
    line-height: 1.5;
  }

  /* ---- Ingredient list ---- */
  .ingredients{
    padding: 10px 18px 8px;
  }
  .col-labels{
    display: flex;
    justify-content: space-between;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.66rem;
    letter-spacing: 0.12em;
    color: var(--text-faint);
    padding: 0 4px 6px;
    border-bottom: 1px solid var(--hairline);
  }
  .group-label{
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-weight: 500;
    font-size: 0.98rem;
    color: var(--accent);
    padding: 22px 4px 8px;
    border-top: 1px solid var(--hairline);
    margin-top: 6px;
  }
  .group-label:first-child{
    border-top: none;
    margin-top: 0;
    padding-top: 4px;
  }
  .ing-row{
    display: flex;
    align-items: baseline;
    gap: 10px;
    padding: 13px 4px;
    border-bottom: 1px solid var(--hairline);
  }
  .ing-name{
    font-size: 0.96rem;
    color: var(--text);
    flex: 0 1 auto;
    max-width: 62%;
  }
  .ing-leader{
    flex: 1 1 auto;
    min-width: 10px;
    border-bottom: 1px dotted var(--text-faint);
    transform: translateY(-5px);
    opacity: 0.5;
  }
  .ing-amt{
    font-family: 'IBM Plex Mono', monospace;
    font-variant-numeric: lining-nums tabular-nums;
    font-weight: 600;
    font-size: 1rem;
    color: var(--accent);
    white-space: nowrap;
    flex-shrink: 0;
  }
  .ing-unit{
    font-family: 'IBM Plex Mono', monospace;
    color: var(--text-muted);
    font-size: 0.72rem;
    margin-left: 2px;
  }

  /* ---- Process notes (collapsible) ---- */
  details.notes{
    margin: 22px 18px 40px;
    border-top: 1px solid var(--hairline-strong);
    padding-top: 4px;
  }
  details.notes summary{
    list-style: none;
    cursor: pointer;
    padding: 14px 4px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.72rem;
    letter-spacing: 0.1em;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  details.notes summary::-webkit-details-marker{ display: none; }
  details.notes summary::after{
    content: "+";
    font-family: 'Fraunces', serif;
    font-size: 1.1rem;
    color: var(--accent);
  }
  details.notes[open] summary::after{ content: "–"; }
  .notes-body{
    padding: 4px 4px 8px;
    color: var(--text-muted);
    font-size: 0.92rem;
    line-height: 1.6;
  }
  .notes-body h3, .notes-body h4{
    font-family: 'Fraunces', serif;
    color: var(--text);
    font-weight: 500;
    margin: 18px 0 6px;
  }
  .notes-body h3:first-child, .notes-body h4:first-child{ margin-top: 0; }
  .notes-body p{ margin: 0 0 12px; }
  .notes-body ul, .notes-body ol{ margin: 0 0 12px; padding-left: 20px; }
  .notes-body li{ margin-bottom: 6px; }
  .notes-body li ul, .notes-body li ol{ margin-top: 6px; }
  .notes-body strong{ color: var(--text); font-weight: 600; }
  .notes-body .note{
    border-left: 2px solid var(--accent-dim);
    padding-left: 12px;
    font-style: italic;
    color: var(--text-faint);
  }

  @media (prefers-reduced-motion: no-preference){
    .titleblock, .ingredients, details.notes{ animation: fadeIn 0.25s ease-out; }
  }
  @keyframes fadeIn{
    from{ opacity: 0; transform: translateY(4px); }
    to{ opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

<div class="topbar">
  <p class="eyebrow">recipe — grams</p>
  <div class="picker">
    <select id="recipeSelect" aria-label="Choose a recipe">
      <option value="" selected disabled>Choose a recipe…</option>
    </select>
  </div>
</div>

<div id="empty" class="empty">
  <p>Pick a recipe above<br>to see it in grams.</p>
</div>

<div id="content" style="display:none;">
  <div class="titleblock">
    <h1 id="recipeTitle"></h1>
    <p id="recipeMeta"></p>
  </div>

  <div class="ingredients">
    <div class="col-labels"><span>Ingredient</span><span>Grams</span></div>
    <div id="ingredientList"></div>
  </div>

  <details class="notes" id="notesDetails" style="display:none;">
    <summary>Process notes</summary>
    <div class="notes-body" id="notesBody"></div>
  </details>
</div>

<script src="recipes.js"></script>
<script>
(function(){

  // The dropdown is built entirely from RECIPE_CATEGORIES, defined in
  // recipes.js. Add a recipe there (both the goGetRecipe() clause and
  // a RECIPE_CATEGORIES entry) and it appears here automatically —
  // nothing in this file needs to change.
  var select = document.getElementById('recipeSelect');
  if (typeof RECIPE_CATEGORIES !== 'undefined') {
    RECIPE_CATEGORIES.forEach(function(group){
      var optgroup = document.createElement('optgroup');
      optgroup.label = group.category;
      group.items.forEach(function(name){
        var opt = document.createElement('option');
        opt.value = name;
        opt.textContent = name;
        optgroup.appendChild(opt);
      });
      select.appendChild(optgroup);
    });
  } else {
    console.error('RECIPE_CATEGORIES not found — check that recipes.js loaded correctly.');
  }

  function formatAmount(n){
    if (Number.isInteger(n)) return String(n);
    var r = Math.round(n * 100) / 100;
    return String(r);
  }

  function ingredientRowHtml(name, amount){
    return '<div class="ing-row">' +
      '<span class="ing-name">' + escapeHtml(name) + '</span>' +
      '<span class="ing-leader"></span>' +
      '<span class="ing-amt">' + formatAmount(amount) + '<span class="ing-unit">g</span></span>' +
    '</div>';
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"]/g, function(c){
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c];
    });
  }

  function renderIngredients(recipe, headers){
    var container = document.getElementById('ingredientList');
    var html = '';
    if (headers && headers.length){
      var idx = 0;
      headers.forEach(function(group){
        var count = group[0], label = group[1];
        html += '<div class="group-label">' + escapeHtml(label) + '</div>';
        for (var i = 0; i < count && idx < recipe.length; i++, idx++){
          html += ingredientRowHtml(recipe[idx][0], recipe[idx][1]);
        }
      });
      for (; idx < recipe.length; idx++){
        html += ingredientRowHtml(recipe[idx][0], recipe[idx][1]);
      }
    } else {
      recipe.forEach(function(item){
        html += ingredientRowHtml(item[0], item[1]);
      });
    }
    container.innerHTML = html;
  }

  // Minimal markdown -> HTML, scoped to the patterns used in recipes.js
  // (##/### headers, - bullets with one nesting level, numbered lists,
  // > notes, **bold**).
  function renderMarkdown(md){
    var lines = md.split('\n');
    var html = '';
    var listStack = []; // stack of {type:'ul'|'ol', indent:n}
    var inParagraph = false;

    function closeLists(toIndent){
      while (listStack.length && (toIndent === undefined || listStack[listStack.length-1].indent >= toIndent)){
        html += '</' + listStack.pop().type + '>';
      }
    }
    function closeParagraph(){
      if (inParagraph){ html += '</p>'; inParagraph = false; }
    }
    function inline(text){
      return escapeHtml(text).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    }

    lines.forEach(function(raw){
      var line = raw.replace(/\r$/, '');
      if (/^\s*$/.test(line)){
        closeParagraph();
        return;
      }
      var m;
      if ((m = line.match(/^###\s+(.*)/))){
        closeLists(); closeParagraph();
        html += '<h4>' + inline(m[1]) + '</h4>';
        return;
      }
      if ((m = line.match(/^##\s+(.*)/))){
        closeLists(); closeParagraph();
        html += '<h3>' + inline(m[1]) + '</h3>';
        return;
      }
      if ((m = line.match(/^>\s?(.*)/))){
        closeLists(); closeParagraph();
        html += '<p class="note">' + inline(m[1]) + '</p>';
        return;
      }
      if ((m = line.match(/^(\s*)-\s+(.*)/))){
        closeParagraph();
        var indent = m[1].length;
        while (listStack.length && listStack[listStack.length-1].indent > indent){
          html += '</' + listStack.pop().type + '>';
        }
        if (!listStack.length || listStack[listStack.length-1].indent < indent){
          html += '<ul>';
          listStack.push({ type: 'ul', indent: indent });
        } else if (listStack[listStack.length-1].type !== 'ul'){
          html += '</' + listStack.pop().type + '><ul>';
          listStack.push({ type: 'ul', indent: indent });
        }
        html += '<li>' + inline(m[2]) + '</li>';
        return;
      }
      if ((m = line.match(/^(\s*)\d+\.\s+(.*)/))){
        closeParagraph();
        var oindent = m[1].length;
        while (listStack.length && listStack[listStack.length-1].indent > oindent){
          html += '</' + listStack.pop().type + '>';
        }
        if (!listStack.length || listStack[listStack.length-1].indent < oindent){
          html += '<ol>';
          listStack.push({ type: 'ol', indent: oindent });
        } else if (listStack[listStack.length-1].type !== 'ol'){
          html += '</' + listStack.pop().type + '><ol>';
          listStack.push({ type: 'ol', indent: oindent });
        }
        html += '<li>' + inline(m[2]) + '</li>';
        return;
      }
      closeLists();
      if (!inParagraph){ html += '<p>'; inParagraph = true; } else { html += ' '; }
      html += inline(line.trim());
    });
    closeLists();
    closeParagraph();
    return html;
  }

  select.addEventListener('change', function(){
    var name = select.value;
    if (!name) return;
    var data = goGetRecipe(name);
    document.getElementById('empty').style.display = 'none';
    var content = document.getElementById('content');
    content.style.display = '';

    if (!data){
      document.getElementById('recipeTitle').textContent = name;
      document.getElementById('recipeMeta').textContent = '';
      document.getElementById('ingredientList').innerHTML =
        '<p style="color:var(--text-muted); padding:12px 4px; font-style:italic;">No data found for this recipe.</p>';
      document.getElementById('notesDetails').style.display = 'none';
      return;
    }

    document.getElementById('recipeTitle').textContent = name;
    document.getElementById('recipeMeta').textContent =
      data.reciPortions > 0 ? ('yields ' + data.reciPortions + ' portions') : '';

    renderIngredients(data.recipe, data.headers);

    var notesDetails = document.getElementById('notesDetails');
    if (data.markdown && data.markdown.trim()){
      document.getElementById('notesBody').innerHTML = renderMarkdown(data.markdown);
      notesDetails.style.display = '';
      notesDetails.open = false;
    } else {
      notesDetails.style.display = 'none';
    }
  });

})();
</script>
</body>
</html>
